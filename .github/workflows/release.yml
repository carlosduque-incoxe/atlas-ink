name: Build Release Artifact (offline signing required)
permissions:
  contents: read
on:
  push:
    tags:
      - '*'

jobs:
  build-release:
    name: Build unsigned artifact for Atlas verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: |
          uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip
          uv pip install --system -U littlefs-python fatfs-ng PyYAML

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build Atlas Ink
        run: pio run -e gh_release

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-Ink-${{ github.ref_name }}
          path: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin

      - name: Record offline signing gate
        run: |
          {
            echo '## Not a published firmware release'
            echo 'This workflow only builds an unsigned artifact.'
            echo 'Atlas must inspect it and run scripts/publish-signed-release.sh with the offline key.'
          } >> "$GITHUB_STEP_SUMMARY"
